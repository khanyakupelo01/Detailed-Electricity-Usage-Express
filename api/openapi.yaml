openapi: 3.0.0
info:
  contact:
    email: khanya.kupelo@icloud.com
    name: Khanya Kupelo
    url: https://e-tarrif-fe.onrender.com/
  description: Server for the Electricity Dashboard
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://e-tarrif-fe.onrender.com/terms/
  title: Electricity Dashboard
  version: 1.0.0
servers:
- description: Current host (same origin as these docs)
  url: /
- description: Hosted server
  url: https://e-tarrif-be.onrender.com
- description: Local development server
  url: http://localhost:8080
paths:
  /api/transactions:
    get:
      operationId: apiTransactionsGET
      parameters:
      - explode: true
        in: query
        name: date_from
        required: true
        example: '2026-09-10'
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: date_to
        required: true
        example: '2026-10-10'
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: type
        required: false
        example: 'purchase'
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        example: 20
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        example: 'abc123'
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example: {transactions: [{id: txn_001, date: "2026-09-10", type: purchase, amount: 250.5}, {id: txn_002, date: "2026-09-25", type: refund, amount: 45}], next_cursor: null}
        "400":
          description: Invalid request
          content:
            application/json:
              example: {message: "request.query.date_from should match format \"date\"", errors: []}
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Retrieve transactions
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/{id}:
    get:
      operationId: apiTransactionsIdGET
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        example: txn_001
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example: {id: txn_001, date: "2026-09-10", type: purchase, amount: 250.5}
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Retrieve a single transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/:
    post:
      operationId: apiTransactionsPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_transactions__post_request"
            example: {date: "2026-09-10", type: purchase, amount: 250.5}
        required: true
      responses:
        "201":
          description: Transaction created successfully
          content:
            application/json:
              example: {id: txn_001, date: "2026-09-10", type: purchase, amount: 250.5}
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Create a new transaction
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/delete/{id}:
    delete:
      operationId: apiTransactionsDeleteIdDELETE
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        example: txn_001
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Transaction deleted successfully
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Delete a transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/update/{id}:
    put:
      operationId: apiTransactionsUpdateIdPUT
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        example: txn_001
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_transactions__post_request"
            example: {date: "2026-09-10", type: purchase, amount: 250.5}
        required: true
      responses:
        "200":
          description: Transaction updated successfully
          content:
            application/json:
              example: {id: txn_001, date: "2026-09-10", type: purchase, amount: 250.5}
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Update a transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
components:
  schemas:
    Transaction:
      properties:
        date:
          example: "2026-09-10"
          format: date
          type: string
        type:
          example: purchase
          type: string
        amount:
          example: 250.5
          format: float
          type: number
      required:
      - amount
      - date
      - type
      type: object
    _api_transactions__post_request:
      properties:
        date:
          example: "2026-09-10"
          format: date
          type: string
        type:
          example: purchase
          type: string
        amount:
          example: 250.5
          format: float
          type: number
      required:
      - amount
      - date
      - type
      type: object
