openapi: 3.0.0
info:
  contact:
    email: khanya.kupelo@icloud.com
    name: Khanya Kupelo
    url: https://e-tarrif-fe.onrender.com/
  description: Server for the Electricity Dashboard
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://e-tarrif-fe.onrender.com/terms/
  title: Electricity Dashboard
  version: 1.0.0
servers:
- description: Current host (same origin as these docs)
  url: /
- description: Hosted server
  url: https://e-tarrif-be.onrender.com
- description: Local development server
  url: http://localhost:8080
paths:
  /api/transactions:
    get:
      operationId: apiTransactionsGET
      parameters:
      - explode: true
        in: query
        name: date_from
        required: true
        example: '2026-09-10'
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: date_to
        required: true
        example: '2026-10-10'
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: type
        required: false
        example: 'purchase'
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        example: 20
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        example: 'abc123'
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionHistory"
              example: {transactions: [{id: txn_001, date: "2026-09-10", timestamp: "2026-09-10T12:30:00Z", type: purchase, amount: 250.5}], next_cursor: null}
        "400":
          description: Invalid request
          content:
            application/json:
              example: {message: "request.query.date_from should match format \"date\"", errors: []}
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable entity
      summary: Retrieve transactions
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/{id}:
    get:
      operationId: apiTransactionsIdGET
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        example: txn_001
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionHistoryItem"
              example: {id: txn_001, date: "2026-09-10", timestamp: "2026-09-10T12:30:00Z", type: purchase, amount: 250.5}
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable entity
      summary: Retrieve a single transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/:
    post:
      operationId: apiTransactionsPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_transactions__post_request"
            example: {meterNumber: "0001234567", timestamp: "2026-09-10T12:30:00+02:00", type: purchase, amount: 250.5}
        required: true
      security:
      - bearerAuth: []
      responses:
        "201":
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPurchaseTransaction"
              example: {id: txn_001, meterNumber: "0001234567", timestamp: "2026-09-10T12:30:00+02:00", date: "2026-09-10", type: purchase, amount: 250.5}
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated client is not authorized to ingest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate purchase transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateTransaction"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      summary: Create a new transaction
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/delete/{id}:
    delete:
      operationId: apiTransactionsDeleteIdDELETE
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        example: txn_001
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Transaction deleted successfully
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable entity
      summary: Delete a transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/update/{id}:
    put:
      operationId: apiTransactionsUpdateIdPUT
      x-codegen-request-body-name: apiTransactionsPostRequest
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        example: txn_001
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_transactions__put_request"
            example: {date: "2026-09-10", type: purchase, amount: 250.5}
        required: true
      responses:
        "200":
          description: Transaction updated successfully
          content:
            application/json:
              example: {id: txn_001, date: "2026-09-10", type: purchase, amount: 250.5}
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable entity
      summary: Update a transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
components:
  schemas:
    Transaction:
      properties:
        date:
          example: "2026-09-10"
          format: date
          type: string
        type:
          example: purchase
          type: string
        amount:
          example: 250.5
          format: float
          type: number
        timestamp:
          example: "2026-09-10T12:30:00Z"
          format: date-time
          type: string
      required:
      - amount
      - date
      - timestamp
      - type
      type: object
    TransactionHistoryItem:
      allOf:
      - $ref: "#/components/schemas/Transaction"
      - properties:
          id:
            type: string
        required:
        - id
        type: object
    TransactionHistory:
      properties:
        transactions:
          items:
            $ref: "#/components/schemas/TransactionHistoryItem"
          type: array
        next_cursor:
          nullable: true
          type: string
      required:
      - transactions
      - next_cursor
      type: object
    CreatedPurchaseTransaction:
      allOf:
      - $ref: "#/components/schemas/TransactionHistoryItem"
      - properties:
          meterNumber:
            type: string
        required:
        - meterNumber
        type: object
    DuplicateTransaction:
      properties:
        code:
          enum:
          - duplicate_transaction
          type: string
        message:
          type: string
        transactionId:
          type: string
      required:
      - code
      - message
      - transactionId
      type: object
    ErrorResponse:
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      type: object
    _api_transactions__post_request:
      properties:
        meterNumber:
          description: A non-empty meter number; surrounding whitespace is trimmed.
          example: "0001234567"
          type: string
        amount:
          description: A finite positive monetary amount.
          example: 250.5
          type: number
        timestamp:
          description: An ISO 8601 date-time containing an explicit timezone.
          example: "2026-09-10T12:30:00+02:00"
          type: string
        type:
          description: Must be purchase.
          example: purchase
          type: string
      additionalProperties: false
      required:
      - amount
      - meterNumber
      - timestamp
      - type
      type: object
    _api_transactions__put_request:
      properties:
        date:
          example: "2026-09-10"
          format: date
          type: string
        type:
          example: purchase
          type: string
        amount:
          example: 250.5
          format: float
          type: number
      required:
      - amount
      - date
      - type
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
      bearerFormat: JWT
