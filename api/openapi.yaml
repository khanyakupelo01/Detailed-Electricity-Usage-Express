openapi: 3.0.0
info:
  contact:
    email: khanya.kupelo@icloud.com
    name: Khanya Kupelo
    url: https://e-tarrif-fe.onrender.com/
  description: Server for the Electricity Dashboard
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://e-tarrif-fe.onrender.com/terms/
  title: Electricity Dashboard
  version: 1.0.0
servers:
- description: Development server
  url: https://e-tarrif-be.onrender.com/
- description: Staging server
  url: https://e-tarrif-be.onrender.com/
- description: Production server
  url: https://e-tarrif-be.onrender.com/
- description: Local development server
  url: http://localhost:8080
paths:
  /api/transactions:
    get:
      operationId: apiTransactionsGET
      parameters:
      - explode: true
        in: query
        name: date_from
        required: true
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: date_to
        required: true
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: type
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Successful response
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Retrieve transactions
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/{id}:
    get:
      operationId: apiTransactionsIdGET
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Successful response
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Retrieve a single transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/:
    post:
      operationId: apiTransactionsPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_transactions__post_request"
        required: true
      responses:
        "201":
          description: Transaction created successfully
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Create a new transaction
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/delete/{id}:
    delete:
      operationId: apiTransactionsDeleteIdDELETE
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Transaction deleted successfully
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Delete a transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
  /api/transactions/update/{id}:
    put:
      operationId: apiTransactionsUpdateIdPUT
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_transactions__post_request"
        required: true
      responses:
        "200":
          description: Transaction updated successfully
        "400":
          description: Invalid request
        "503":
          description: Service unavailable
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
        "422":
          description: Unprocessable entity
      summary: Update a transaction by ID
      tags:
      - Electricity
      x-eov-operation-handler: controllers/ElectricityController
components:
  schemas:
    Transaction:
      properties:
        date:
          format: date
          type: string
        type:
          type: string
        amount:
          format: float
          type: number
      required:
      - amount
      - date
      - type
      type: object
    _api_transactions__post_request:
      properties:
        date:
          format: date
          type: string
        type:
          type: string
        amount:
          format: float
          type: number
      required:
      - amount
      - date
      - type
      type: object
