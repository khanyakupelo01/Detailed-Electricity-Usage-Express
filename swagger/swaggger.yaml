
---
openapi: 3.0.0
info:
  title: Electricity Dashboard 
  version: 1.0.0
  description: Server for the Electricity Dashboard
  termsOfService: https://e-tarrif-fe.onrender.com/terms/
  contact:
    name: Khanya Kupelo
    email: khanya.kupelo@icloud.com
    url: https://e-tarrif-fe.onrender.com/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://e-tarrif-be.onrender.com/
  description: Development server
- url: https://e-tarrif-be.onrender.com/
  description: Staging server
- url: https://e-tarrif-be.onrender.com/
  description: Production server
paths: 
  /api/transactions:
    get:
      summary: Retrieve transactions
      tags:
        - Electricity
      parameters:
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: type
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
          required: false
        - in: query
          name: cursor
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid request
        '503':
          description: Service unavailable
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
        '422':
          description: Unprocessable entity
  /api/transactions/{id}:
    get:
      summary: Retrieve a single transaction by ID
      tags:
        - Electricity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid request
        '503':
          description: Service unavailable
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
        '422':
          description: Unprocessable entity
  /api/transactions/:
    post:
      tags:
        - Electricity
      summary: Create a new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                type:
                  type: string
                amount:
                  type: number
                  format: float
              required:
                - date
                - type
                - amount
      responses:
        '201':
          description: Transaction created successfully
        '400':
          description: Invalid request
        '503':
          description: Service unavailable
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
        '422':
          description: Unprocessable entity
  /api/transactions/delete/{id}:
    delete:
      summary: Delete a transaction by ID
      tags:
          - Electricity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '204':
          description: Transaction deleted successfully
        '400':
          description: Invalid request
        '503':
          description: Service unavailable
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
        '422':
          description: Unprocessable entity
  /api/transactions/update/{id}:
    put:
      summary: Update a transaction by ID
      tags:
        - Electricity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                type:
                  type: string
                amount:
                  type: number
                  format: float
              required:
                - date
                - type
                - amount
      responses:
        '200':
          description: Transaction updated successfully
        '400':
          description: Invalid request
        '503':
          description: Service unavailable
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
        '422':
          description: Unprocessable entity
components:
  schemas:
    Transaction:
      type: object
      properties:
        date:
          type: string
          format: date
        type:
          type: string
        amount:
          type: number
          format: float
      required:
        - date
        - type
        - amount
...